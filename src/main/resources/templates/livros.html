<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Livros</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header>
    <h1>Sistema de Biblioteca</h1>
    <nav>
        <a th:href="@{/}">Início</a>
        <a th:href="@{/livros}">Livros</a>
        <a th:href="@{/autores}">Autores</a>
        <a th:href="@{/categorias}">Categorias</a>
        <a th:href="@{/usuarios}">Usuários</a>
        <a th:href="@{/emprestimos}">Empréstimos</a>
    </nav>
</header>

<section>
    <h2>Cadastrar Livro</h2>

    <form th:action="@{/livros}" method="post">
        <input type="text" name="titulo" placeholder="Título" required>
        <input type="text" name="autor.nome" placeholder="Nome do autor" required>
        <input type="text" name="autor.nacionalidade" placeholder="Nacionalidade">
        <input type="text" name="isbn" placeholder="ISBN" required>
        <input type="text" name="categoria.categoria" placeholder="Categoria" required>
        <input type="text" name="disponibilidade" placeholder="Disponibilidade" required>
        <button type="submit">Cadastrar</button>
    </form>
</section>

<section>
    <h2>Livros cadastrados</h2>

    <div th:each="livro, status : ${livros}">

        <form th:action="@{/livros/atualizar/{indice}(indice=${status.index})}" method="post">

            <input type="text" name="titulo" th:value="${livro.titulo}" required>
            <input type="text" name="autor.nome" th:value="${livro.autor != null ? livro.autor.nome : ''}" placeholder="Autor">
            <input type="text" name="autor.nacionalidade" th:value="${livro.autor != null ? livro.autor.nacionalidade : ''}" placeholder="Nacionalidade">
            <input type="text" name="isbn" th:value="${livro.isbn}" required>
            <input type="text" name="categoria.categoria" th:value="${livro.categoria != null ? livro.categoria.categoria : ''}" placeholder="Categoria">
            <input type="text" name="disponibilidade" th:value="${livro.disponibilidade}" required>

            <button type="submit">Atualizar</button>
        </form>

        <form th:action="@{/livros/excluir/{indice}(indice=${status.index})}" method="post">
            <input type="hidden" name="_method" value="delete">
            <button type="submit">Excluir</button>
        </form>

        <hr>
    </div>
</section>

</body>
</html>
